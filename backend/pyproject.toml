[project]
name = "travel-agent"
version = "0.1.0"
description = "多智能体旅行规划 Agent（LangGraph + FastAPI + MCP）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sse-starlette>=2.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "langsmith>=0.14.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
